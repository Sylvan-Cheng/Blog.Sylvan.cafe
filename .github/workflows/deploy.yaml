name: Deploy Astro Blog

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          PUBLIC_GOOGLE_SITE_VERIFICATION: dkAat9gMwLx3qEjtwNz0fhHY5MPfSkmR0poDvVRel0Q
          IMGPROXY_KEY: ${{ secrets.IMGPROXY_KEY }}
          IMGPROXY_SALT: ${{ secrets.IMGPROXY_SALT }}
        run: pnpm run build

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-avz --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_PORT: "2222"
          REMOTE_USER: "github"
          TARGET: "/blog/sylvan.cafe/"
